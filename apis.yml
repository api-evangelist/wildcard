name: Wildcard
description: 'Wildcard is a PvP collectible-card-based MOBA (multiplayer online battle
  arena) developed by Playful Studios and currently in Early Access on Steam. Players
  pick Champions, assemble decks of Summon creature cards, and compete in real-time
  strategic arena battles where deck-building matters as much as mechanical skill.
  The game ships collectible cosmetics (Wildpass, Flair, Wildfile) with a web3 angle
  — the Wildpass is a Polygon NFT collection tradeable on Magic Eden — and is backed
  as a portfolio company of the crypto venture firm Paradigm. Its backend gaming services
  are built on Beamable and Unreal Engine. No first-party public developer API, SDK,
  or documentation portal is published; this profile is a company/lead record in the
  API Evangelist network. Sector: gaming.'
